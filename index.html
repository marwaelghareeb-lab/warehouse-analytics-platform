    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&family=Syne:wght@700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      // Prevent benign Vite HMR WebSocket disconnection errors in Cloud Run preview/iframe
      (function() {
        if (typeof window === 'undefined') return;

        // Suppress console.error for benign Vite WebSocket connection notices
        const origConsoleError = console.error;
        console.error = function(...args) {
          const msg = args.map(function(a) { return typeof a === 'object' ? JSON.stringify(a) : String(a); }).join(' ');
          if (msg.includes('WebSocket') || msg.includes('[vite] failed to connect')) {
            return;
          }
          origConsoleError.apply(console, args);
        };

        // Suppress unhandled rejections and global errors related to WebSocket
        const filterError = function(e) {
          const reason = e ? (e.reason || e.message || e.error) : '';
          const str = String(reason || '');
          if (str.includes('WebSocket') || str.includes('websocket')) {
            if (e.preventDefault) e.preventDefault();
            if (e.stopPropagation) e.stopPropagation();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            return true;
          }
        };
        window.addEventListener('unhandledrejection', filterError, true);
        window.addEventListener('error', filterError, true);

        // Intercept Vite-HMR WebSocket so connection smoothly resolves and stays silent
        const NativeWebSocket = window.WebSocket;
        if (NativeWebSocket) {
          window.WebSocket = function(url, protocols) {
            const isViteHmr = 
              protocols === 'vite-hmr' || 
              (Array.isArray(protocols) && protocols.includes('vite-hmr')) ||
              (typeof url === 'string' && (url.includes('token=') || url.includes('/@vite/')));

            if (isViteHmr) {
              const emitter = new EventTarget();
              emitter.binaryType = 'blob';
              emitter.bufferedAmount = 0;
              emitter.extensions = '';
              emitter.protocol = 'vite-hmr';
              emitter.readyState = 0; // CONNECTING
              emitter.url = url;
              emitter.onopen = null;
              emitter.onclose = null;
              emitter.onerror = null;
              emitter.onmessage = null;

              emitter.send = function() {};
              emitter.close = function(code, reason) {
                emitter.readyState = 3; // CLOSED
                var closeEvt;
                try {
                  closeEvt = new CloseEvent('close', { wasClean: true, code: code || 1000, reason: reason || '' });
                } catch (_) {
                  closeEvt = new Event('close');
                }
                if (typeof emitter.onclose === 'function') emitter.onclose(closeEvt);
                emitter.dispatchEvent(closeEvt);
              };

              // Dispatch open event cleanly so Vite's connection promise resolves without error
              setTimeout(function() {
                emitter.readyState = 1; // OPEN
                var openEvt = new Event('open');
                if (typeof emitter.onopen === 'function') emitter.onopen(openEvt);
                emitter.dispatchEvent(openEvt);
              }, 20);

              return emitter;
            }

            return new NativeWebSocket(url, protocols);
          };
          window.WebSocket.prototype = NativeWebSocket.prototype;
          window.WebSocket.CONNECTING = NativeWebSocket.CONNECTING;
          window.WebSocket.OPEN = NativeWebSocket.OPEN;
          window.WebSocket.CLOSING = NativeWebSocket.CLOSING;
          window.WebSocket.CLOSED = NativeWebSocket.CLOSED;
        }
      })();
    </script>

  </body>
